<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="스프라이트 시트와 프레임 좌표를 이용해 캐릭터 애니메이션을 구현하는 2D 게임 프로그래밍 강의">
<title>LEC 08 애니메이션</title>
<style>

    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap");

    :root {
      --bg: #edf1f5;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #5c6776;
      --line: #d7dde6;
      --accent: #1767a8;
      --green: #16806f;
      --code-bg: #101827;
      --code-ink: #f0f6ff;
      --code-font: "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", "Segoe UI", Arial, sans-serif;
    }

    body { overflow: hidden; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .bar {
      width: 180px;
      height: 8px;
      background: #dfe6ef;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      padding: 18px 24px;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      display: none;
      width: min(100%, 1240px);
      height: min(100%, calc((100vw - 420px) * 0.5625));
      min-height: 620px;
      max-height: calc(100vh - 134px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(23, 32, 51, 0.14);
      grid-template-rows: auto 1fr;
    }

    .slide.active {
      display: grid;
    }

    .slide-head {
      padding: 28px 34px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #f7f9fc);
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
    }

    .pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: #e8f2fb;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 46px;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.4;
    }

    .slide-body {
      min-height: 0;
      padding: 26px 34px 30px;
      overflow: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.78fr);
      gap: 26px;
      align-items: start;
    }

    .bullets {
      margin: 0;
      padding-left: 28px;
      font-size: 27px;
      line-height: 1.44;
    }

    .bullets li { margin-bottom: 14px; }
    .bullets strong { color: var(--accent); }

    .note {
      margin-top: 18px;
      padding: 16px 18px;
      border-left: 5px solid var(--green);
      background: #edf8f5;
      border-radius: 4px 8px 8px 4px;
      font-size: 20px;
      line-height: 1.5;
    }

    pre {
      margin: 0;
      padding: 18px;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-ink);
      overflow: auto;
      font-family: var(--code-font);
      font-size: 18px;
      line-height: 1.45;
      white-space: pre;
    }

    code.fn {
      color: #8ee9ff;
      text-decoration: underline;
      cursor: pointer;
    }

    .diagram {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: #f6f8fb;
    }

    .flow {
      display: grid;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .flow-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .box {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      border: 2px solid #b8cadc;
      border-radius: 8px;
      background: #fff;
    }

    .arrow {
      color: var(--accent);
      font-size: 28px;
      font-weight: 900;
    }

    .canvas {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 2px solid #31435c;
      border-radius: 8px;
      background:
        linear-gradient(#d9e4ef 1px, transparent 1px),
        linear-gradient(90deg, #d9e4ef 1px, transparent 1px),
        #fff;
      background-size: 10% 10%;
      overflow: hidden;
    }

    .grass {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22%;
      background: linear-gradient(180deg, #72bc62, #347a3d);
      border-top: 4px solid #275e31;
    }

    .boy {
      position: absolute;
      width: 48px;
      height: 64px;
      border: 2px solid #183152;
      border-radius: 18px 18px 10px 10px;
      background: linear-gradient(180deg, #4e90d8 0 54%, #263d66 54% 100%);
      box-shadow: 0 5px 0 rgba(24, 49, 82, 0.12);
    }

    .boy::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 10px;
      top: -18px;
      border: 2px solid #183152;
      border-radius: 50%;
      background: #f1c69a;
    }

    .boy.center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .boy.a { left: 15%; bottom: 16%; }
    .boy.b { left: 43%; bottom: 43%; }
    .boy.c { left: 68%; bottom: 20%; }

    .label {
      position: absolute;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.9);
      color: #31435c;
      font-size: 15px;
      font-weight: 700;
    }

    .lb { left: 8px; bottom: 8px; }
    .rb { right: 8px; bottom: 8px; }
    .lt { left: 8px; top: 8px; }
    .ct { left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--accent); }

    details.detail {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    details.detail summary {
      padding: 15px 18px;
      cursor: pointer;
      list-style: none;
      background: #f2f7fc;
      color: var(--accent);
      font-size: 19px;
      font-weight: 800;
    }

    details.detail summary::-webkit-details-marker { display: none; }

    .detail-text {
      padding: 18px;
      color: #263244;
      font-size: 18px;
      line-height: 1.62;
    }

    .detail-text p {
      margin: 0 0 14px;
    }

    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #f7f9fc;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .panel-body {
      min-height: 0;
      overflow: auto;
      padding: 16px 18px 20px;
    }

    .toc {
      display: grid;
      gap: 8px;
    }

    .toc button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      padding: 9px 10px;
      text-align: left;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.32;
      cursor: pointer;
    }

    .toc button:hover { background: #eef5fb; }
    .toc button.active {
      border-color: #b8d6ee;
      background: #e6f2fb;
      color: var(--accent);
      font-weight: 800;
    }

    .func-card {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .func-card h3 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 19px;
    }

    .func-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .func-card .sample {
      display: block;
      padding: 10px;
      border-radius: 6px;
      background: #eef2f6;
      color: var(--ink);
      font-family: var(--code-font);
      white-space: pre-wrap;
    }

    footer.controls {
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 24px 16px;
      background: #fff;
      border-top: 1px solid var(--line);
    }

    button.nav, button.util {
      height: 42px;
      padding: 0 16px;
      border: 1px solid #b8c6d6;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    button.nav:hover, button.util:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.nav:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .assignment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .assignment {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f8fb;
    }

    .assignment h3 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 24px;
    }

    .assignment ul {
      margin: 0;
      padding-left: 22px;
      font-size: 19px;
      line-height: 1.45;
    }

    @media (max-width: 1080px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      main { grid-template-columns: 1fr; }
      .slide { height: auto; min-height: 0; max-height: none; }
      .grid, .assignment-grid { grid-template-columns: 1fr; }
      footer.controls {
        position: sticky;
        bottom: 0;
        grid-template-columns: 1fr 1fr;
      }
      .hint { display: none; }
    }
  

    .loader {
      width: min(100%, 900px);
      margin: 40px auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(23, 32, 51, 0.12);
      font-size: 18px;
      line-height: 1.6;
    }

    .loader h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .loader input {
      margin-top: 14px;
      font-size: 16px;
    }

    body.fullscreen-mode {
      overflow: hidden;
      background: #000;
      --fs-title: clamp(60px, 3.42vw, 110px);
      --fs-subtitle: clamp(26px, 1.5vw, 53px);
      --fs-kicker: clamp(20px, 1.14vw, 38px);
      --fs-pill: clamp(16px, 0.86vw, 29px);
      --fs-body: clamp(38px, 2.18vw, 70px);
      --fs-note: clamp(26px, 1.44vw, 48px);
      --fs-code: clamp(23px, 1.25vw, 41px);
      --fs-flow: clamp(26px, 1.5vw, 50px);
      --fs-label: clamp(20px, 1.14vw, 36px);
      --fs-assignment-title: clamp(31px, 1.74vw, 58px);
      --fs-assignment-body: clamp(26px, 1.38vw, 46px);
      --fs-pad-x: clamp(50px, 2.64vw, 110px);
      --fs-pad-y: clamp(34px, 1.86vw, 77px);
    }

    body.fullscreen-mode header.top,
    body.fullscreen-mode .panel,
    body.fullscreen-mode footer.controls,
    body.fullscreen-mode details.detail {
      display: none;
    }

    body.fullscreen-mode .app {
      height: 100vh;
      min-height: 0;
      display: block;
    }

    body.fullscreen-mode main {
      width: 100vw;
      height: 100vh;
      padding: 0;
      display: block;
    }

    body.fullscreen-mode .stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    body.fullscreen-mode .slide {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.fullscreen-mode .slide-head {
      padding: var(--fs-pad-y) var(--fs-pad-x) clamp(24px, 1.26vw, 50px);
    }

    body.fullscreen-mode .kicker {
      font-size: var(--fs-kicker);
      margin-bottom: clamp(12px, 0.62vw, 24px);
    }

    body.fullscreen-mode .pill {
      font-size: var(--fs-pill);
      padding: clamp(6px, 0.34vw, 12px) clamp(12px, 0.62vw, 24px);
    }

    body.fullscreen-mode h1 {
      font-size: var(--fs-title);
      line-height: 1.12;
    }

    body.fullscreen-mode .subtitle {
      margin-top: clamp(14px, 0.74vw, 29px);
      font-size: var(--fs-subtitle);
      line-height: 1.38;
    }

    body.fullscreen-mode .slide-body {
      padding: var(--fs-pad-y) var(--fs-pad-x) clamp(41px, 2.16vw, 86px);
    }

    body.fullscreen-mode .grid {
      gap: clamp(36px, 1.86vw, 77px);
      grid-template-columns: minmax(0, 1fr) minmax(clamp(408px, 21.24vw, 816px), 0.8fr);
    }

    body.fullscreen-mode .bullets {
      padding-left: clamp(38px, 2vw, 79px);
      font-size: var(--fs-body);
      line-height: 1.42;
    }

    body.fullscreen-mode .bullets li {
      margin-bottom: clamp(19px, 1vw, 41px);
    }

    body.fullscreen-mode .note {
      margin-top: clamp(24px, 1.26vw, 50px);
      padding: clamp(22px, 1.14vw, 46px) clamp(24px, 1.26vw, 50px);
      border-left-width: clamp(7px, 0.38vw, 14px);
      font-size: var(--fs-note);
      line-height: 1.5;
    }

    body.fullscreen-mode pre {
      padding: clamp(24px, 1.26vw, 50px);
      font-size: var(--fs-code);
      line-height: 1.45;
    }

    body.fullscreen-mode .diagram {
      padding: clamp(26px, 1.38vw, 55px);
    }

    body.fullscreen-mode .flow {
      gap: clamp(17px, 0.88vw, 36px);
      font-size: var(--fs-flow);
    }

    body.fullscreen-mode .box {
      min-height: clamp(91px, 4.74vw, 182px);
      padding: clamp(22px, 1.14vw, 46px);
    }

    body.fullscreen-mode .arrow {
      font-size: clamp(41px, 2.12vw, 82px);
    }

    body.fullscreen-mode .canvas {
      min-height: clamp(504px, 26.28vw, 912px);
    }

    body.fullscreen-mode .label {
      padding: clamp(6px, 0.34vw, 12px) clamp(11px, 0.56vw, 22px);
      font-size: var(--fs-label);
    }

    body.fullscreen-mode .assignment-grid {
      gap: clamp(24px, 1.26vw, 50px);
    }

    body.fullscreen-mode .assignment {
      padding: clamp(24px, 1.26vw, 50px);
    }

    body.fullscreen-mode .assignment h3 {
      font-size: var(--fs-assignment-title);
      margin-bottom: clamp(14px, 0.74vw, 29px);
    }

    body.fullscreen-mode .assignment ul {
      padding-left: clamp(31px, 1.62vw, 62px);
      font-size: var(--fs-assignment-body);
      line-height: 1.45;
    }

/* Lecture content adapters; the LEC05 shell and typography remain authoritative. */
*{letter-spacing:0}button{font-family:inherit}button:focus-visible,summary:focus-visible{outline:3px solid #bb8619;outline-offset:3px}
.app{grid-template-columns:minmax(0,1fr)}main,.slide,.content,.visual{min-width:0}
.content{font-size:27px;line-height:1.44;overflow-wrap:anywhere}
.content p{margin:0 0 18px}.content ul,.content ol{margin:0;padding-left:28px}
.content li{margin-bottom:14px}.content strong{color:var(--accent)}
.content pre+pre{margin-top:18px}pre{max-width:100%}code{font-family:var(--code-font)}
p code,li code{font-size:.9em;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:19px;margin:16px 0}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--accent);background:#eef5fb}
.visual svg{display:block;width:100%;height:auto;background:#f6f8fb;border:1px solid var(--line);border-radius:8px}
.visual text{font-family:Pretendard,'Malgun Gothic',sans-serif;fill:var(--ink);font-size:17px}
.visual-image{display:block;width:100%;max-height:420px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.visual-caption{margin:8px 0 0;color:var(--muted);font-size:14px;text-align:center}
.lec-flow{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}
.lec-flow b{font-size:20px;font-weight:700;padding:12px;border:2px solid #b8cadc;border-radius:8px;background:#fff}
.lec-flow span{color:var(--accent);font-size:28px}.console{margin-top:18px}
.extras{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;font-size:18px;line-height:1.62}
.extras h2{font-size:19px;color:var(--accent);margin:0 0 10px}.extras pre{white-space:pre-wrap;overflow-wrap:anywhere}
.prompt{margin-top:22px}.prompt pre{white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:block;margin:0 0 8px auto;background:#fff;border:1px solid #b8c6d6;border-radius:6px;padding:7px 12px;cursor:pointer}
.detail-text pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}.detail-text{overflow-wrap:anywhere}
.cover-slide{grid-template-rows:1fr!important}.cover{align-self:center;padding:42px 48px}
.cover h1{line-height:1.3}.cover .date{margin-top:38px;font-size:22px;color:var(--muted)}.cover .presenter{margin-top:16px;font-size:24px}
.cover-mode .panel{visibility:hidden}.cover-mode .top .brand,.cover-mode .counter{visibility:hidden}
.cover-mode #detail-button{display:none}.cover-mode .controls{grid-template-columns:auto 1fr auto auto}
.status{position:fixed;bottom:80px;left:24px;background:var(--ink);color:white;padding:10px 16px;border-radius:6px;z-index:10}.status:empty{display:none}
body.fullscreen-mode .content{font-size:var(--fs-body)}
body.fullscreen-mode .extras,body.fullscreen-mode .copy{display:none}
body.fullscreen-mode .prompt{margin-top:24px}
body.fullscreen-mode .cover{padding:var(--fs-pad-y) var(--fs-pad-x)}
body.fullscreen-mode .cover h1{font-size:var(--fs-title)}
body.fullscreen-mode .cover .date,body.fullscreen-mode .cover .presenter{font-size:var(--fs-subtitle)}
@media(max-width:1080px){.cover-mode .panel{display:none}.cover-mode .controls{grid-template-columns:1fr 1fr}.content pre{font-size:16px}.visual{margin-top:20px}.content{font-size:23px}}
@media(max-width:600px){header.top{padding:12px 14px;gap:10px}.bar{width:65px}.brand strong{font-size:15px}.brand span{font-size:12px}
main{padding:12px;gap:12px}.slide-head{padding:22px 20px 16px}h1{font-size:30px}.subtitle{font-size:18px}
.slide-body{padding:20px}.content{font-size:21px}.content pre{font-size:14px}.detail-text{font-size:17px}
.pill{font-size:12px}.kicker{font-size:14px}footer.controls{padding:10px 12px}.cover{padding:30px 24px}.cover .date{font-size:18px}.cover .presenter{font-size:20px}
table{font-size:15px}td,th{padding:8px}.panel-head h2{font-size:18px}
body.fullscreen-mode h1{font-size:32px}body.fullscreen-mode .slide-head,body.fullscreen-mode .slide-body{padding:24px}
body.fullscreen-mode .grid{grid-template-columns:minmax(0,1fr)}body.fullscreen-mode .content{font-size:23px}
body.fullscreen-mode .cover h1{font-size:34px}body.fullscreen-mode .cover{padding:24px}}
.fn{display:inline;border:0;padding:0;background:none;color:#8ee9ff;font:inherit;text-decoration:underline;cursor:pointer}
</style>
</head>

        "height\u003c/code>를 가진 튜플로 표현한다. 한 action은 여러 frame의 순서 있는 묶음이고, sprite는 여러 action의 ",
        "묶음이다.\u003c/p>\n\u003cp>이 좌표 정보는 실행 중에 바뀌지 않으므로 튜플을 사용하면 데이터의 성격이 명확해진다.\u003c/p>\n\u003chr />"
      ],
      "image": "",
      "imageAlt": "Sprite 자료 구조 참고 이미지",
      "imageCaption": "",
      "extras": [],
      "prompt": ""
    },
    {
      "id": "lec08-summary",
      "type": "content",
      "navTitle": "수업 정리",
      "section": "정리",
      "kicker": "수업 요약",
      "subtitle": "스프라이트 애니메이션의 핵심 개념 정리",
      "layout": "summary",
      "visual": "화면 내용의 핵심 항목을 흐름과 함께 배치한다.",
      "number": 17,
      "title": "수업 정리",
      "body": [
        "\u003cul>\n\u003cli>여러 frame을 순서대로 출력하여 하나의 action 구현\u003c/li>\n\u003cli>\u003ccode>clip_draw()\u003c/code>를 ",
        "이용한 스프라이트 시트의 프레임 선택\u003c/li>\n\u003cli>frame과 action 번호를 이용한 좌표 계산\u003c/li>\n\u003cli>균일하거나 불규칙한 ",
        "프레임의 데이터 관리\u003c/li>\n\u003c/ul>"
      ],
      "detailHtml": [
        "\u003cp>스프라이트 애니메이션은 현재 action과 frame을 이용해 캐릭터의 동작을 표현한다. 균일한 스프라이트 시트는 프레임 번호로 좌표를 ",
        "계산하고, 불규칙한 시트는 각 프레임의 사각형 정보를 자료 구조로 관리한다.\u003c/p>"
      ],

      "imageAlt": "수업 정리 참고 이미지",

<script>
const deck=JSON.parse(document.getElementById('deck-data').textContent);
const $=id=>document.getElementById(id), escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const htmlText=value=>Array.isArray(value)?value.join(''):(value||'');
let index=0;const opened=new Set();
function flow(labels){return '<div class="lec-flow">'+labels.map((l,i)=>(i?'<span aria-hidden="true">→</span>':'')+'<b>'+escapeText(l)+'</b>').join('')+'</div>'}
function diagram(kind){
 const begin='<div class="visual"><svg viewBox="0 0 800 430" role="img" aria-label="'+({circle:'원운동의 중심과 네 기준 좌표',triangle:'삼각 운동의 꼭짓점과 진행 비율',rectangle:'사각 운동의 함수별 이동 방향',image:'800 곱하기 600 캔버스의 중심 위치'}[kind])+'"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16806f"/></marker></defs>';
 let body='';
 if(kind==='circle')body='<path d="M100 350H740M160 390V35" stroke="#c1cbd3" fill="none"/><text x="740" y="375">x</text><text x="140" y="35">y</text><circle cx="400" cy="215" r="135" fill="none" stroke="#1767a8" stroke-width="3"/><path d="M400 215H535M523 156L510 132" stroke="#16806f" stroke-width="3" marker-end="url(#arrow)"/><circle cx="400" cy="215" r="5" fill="#16806f"/><text x="410" y="242">중심 (400, 300)</text><text x="425" y="204">r = 200</text><text x="545" y="219">0° (600, 300)</text><text x="328" y="58">90° (400, 500)</text><text x="75" y="219">180° (200, 300)</text><text x="320" y="380">270° (400, 100)</text>';
 if(kind==='triangle')body='<path d="M145 330H655L400 70Z" stroke="#1767a8" stroke-width="3" fill="#eaf3f7"/><path d="M290 330H430M570 243L508 180M294 178L237 236" stroke="#16806f" stroke-width="3" marker-end="url(#arrow)"/><circle cx="528" cy="200" r="6" fill="#b47918"/><text x="78" y="368">A (100, 100)</text><text x="582" y="368">B (700, 100)</text><text x="335" y="48">C (400, 500)</text><text x="550" y="200">t = 0.5</text><text x="655" y="310">t = 0</text><text x="430" y="88">t = 1</text>';
 if(kind==='rectangle')body='<rect x="155" y="85" width="490" height="245" fill="#eaf3f7" stroke="#1767a8" stroke-width="3"/><path d="M275 85H485M645 150V250M510 330H315M155 260V160" stroke="#16806f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="355" y="62">move_top()</text><text x="655" y="215">move_right()</text><text x="330" y="365">move_bottom()</text><text x="24" y="215">move_left()</text>';
 if(kind==='image')body='<rect x="145" y="45" width="510" height="330" fill="#eaf3f7" stroke="#1767a8" stroke-width="2"/><path d="M145 210H655M400 45V375" stroke="#c1cbd3" stroke-dasharray="5 5"/><circle cx="400" cy="210" r="7" fill="#16806f"/><text x="415" y="202">이미지 중심 (400, 300)</text><text x="145" y="405">(0, 0)</text><text x="570" y="405">x → 800</text><text x="62" y="54">y ↑ 600</text>';
 return begin+body+'</svg></div>';
}
function visual(s){
 if(!s.image)return '';
 return '<div class="visual"><img class="visual-image" src="'+s.image+'" alt="'+escapeText(s.imageAlt||s.title)+'">'+(s.imageCaption?'<p class="visual-caption">'+escapeText(s.imageCaption)+'</p>':'')+'</div>';
}
const functionDocs={
'clip_draw':['프레임 출력','원본 이미지에서 사각형 영역을 잘라 지정한 캔버스 위치에 그립니다.','image.clip_draw(left, bottom, width, height, x, y)'],
'clip_composite_draw':['변환 출력','원본 이미지 일부를 잘라 회전하거나 반전한 뒤 지정한 크기로 그립니다.','image.clip_composite_draw(left, bottom, width, height, 0, "h", x, y, w, h)'],
'get_events':['이벤트 수집','현재까지 발생한 키보드, 마우스, 창 이벤트를 리스트로 반환합니다.','events = get_events()'],
'clear_canvas':['캔버스 지우기','다음 화면을 그리기 전에 캔버스의 이전 내용을 지웁니다.','clear_canvas()'],
'update_canvas':['화면 갱신','현재 프레임에서 그린 내용을 화면에 표시합니다.','update_canvas()'],
'delay':['잠시 기다리기','인자로 전달한 초만큼 실행을 기다려 애니메이션 속도를 조절합니다.','delay(0.05)'],
'close_canvas':['캔버스 닫기','게임 루프가 끝난 뒤 사용 중인 캔버스를 닫습니다.','close_canvas()'],
'hide_cursor':['커서 숨기기','시스템 마우스 커서를 숨깁니다.','hide_cursor()'],
'range':['반복 범위','시작값부터 종료값 직전까지 일정 간격의 정수를 만듭니다.','range(0, 800, 5)']
};
function highlightFunctions(){document.querySelectorAll('.slide-body pre code.language-python').forEach(code=>{
const text=code.textContent;code.innerHTML=escapeText(text).replace(/\b(clip_draw|clip_composite_draw|get_events|clear_canvas|update_canvas|delay|close_canvas|hide_cursor|range)(?=\()/g,'<button class="fn" data-fn="$1">$1</button>');
})}
function render(){
const s=deck.slides[index],cover=s.type==='title',hasDetail=!!htmlText(s.detailHtml);document.body.classList.toggle('cover-mode',cover);
let content=htmlText(s.body);
const media=visual(s), grouped=media.includes('class="visual"');
const main=grouped?'<div class="grid"><div class="content">'+content+'</div>'+media+'</div>':'<div class="content">'+content+'</div>'+media;
$('stage').innerHTML=cover?'<article class="slide active cover-slide"><div class="cover"><h1>'+escapeText(deck.title)+'</h1><div class="date">'+escapeText(deck.date)+'</div><div class="presenter">'+escapeText(deck.presenter)+'</div></div></article>':
'<article class="slide active"><div class="slide-head"><div class="kicker"><span class="pill">'+escapeText(s.section)+'</span> '+escapeText(s.kicker)+'</div><h1>'+escapeText(s.title)+'</h1><div class="subtitle">'+escapeText(s.subtitle)+'</div></div><div class="slide-body">'+main+(s.prompt?'<section class="prompt" aria-label="AI 요청문"><button class="copy">요청문 복사</button>'+htmlText(s.prompt)+'</section>':'')+s.extras.map(e=>'<section class="extras"><h2>'+escapeText(e.title)+'</h2>'+htmlText(e.html)+'</section>').join('')+(hasDetail?'<details class="detail" id="detail" '+(opened.has(index)?'open':'')+'><summary>상세 설명 열기</summary><div class="detail-text">'+htmlText(s.detailHtml)+'</div></details>':'')+'</div></article>';
$('slide-title').textContent=s.navTitle;$('count').textContent=(index+1)+' / '+deck.slides.length;$('page').textContent='← / → 로 슬라이드 이동, D 로 상세 설명 열기/닫기';
$('bar').style.width=((index+1)/deck.slides.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===deck.slides.length-1;$('detail-button').hidden=cover||!hasDetail;$('detail-button').setAttribute('aria-expanded',String(opened.has(index)));
document.querySelectorAll('#toc button').forEach((b,i)=>{b.setAttribute('aria-current',String(i===index));b.classList.toggle('active',i===index)});
const detail=$('detail'),slideIndex=index;if(detail)detail.addEventListener('toggle',()=>{if(!detail.isConnected)return;detail.open?opened.add(slideIndex):opened.delete(slideIndex);$('detail-button').setAttribute('aria-expanded',String(detail.open))});
const copy=document.querySelector('.copy');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('.prompt pre').innerText);announce('요청문을 복사했습니다.')}catch{announce('요청문을 선택하여 복사해 주세요.')}};
highlightFunctions();
}
function announce(msg){$('status').textContent=msg;setTimeout(()=>$('status').textContent='',3000)}
function go(n){index=Math.max(0,Math.min(deck.slides.length-1,n));render()}
function detailToggle(){const d=$('detail');if(!d)return;d.open=!d.open;if(d.open){opened.add(index);d.scrollIntoView({block:'start',inline:'nearest'})}else opened.delete(index)}
function syncFullscreen(){const active=!!document.fullscreenElement;document.body.classList.toggle('fullscreen-mode',active);$('fullscreen').textContent=active?'전체 화면 종료':'전체 화면'}
async function fullscreen(){try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen();syncFullscreen()}catch{announce('이 브라우저에서는 전체 화면을 사용할 수 없습니다.')}}
deck.slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+s.navTitle;b.onclick=()=>go(i);$('toc').append(b)});
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('detail-button').onclick=detailToggle;$('fullscreen').onclick=fullscreen;
document.addEventListener('click',e=>{const b=e.target.closest('[data-fn]');if(!b)return;const d=functionDocs[b.dataset.fn];$('func-card').innerHTML='<h3>'+d[0]+'</h3><p>'+d[1]+'</p><span class="sample">'+escapeText(d[2])+'</span>'});
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}if(e.key.toLowerCase()==='d'&&!document.fullscreenElement){e.preventDefault();detailToggle()}if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}});render();
</script></body></html>
